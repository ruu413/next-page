a><a class="MuiButtonBase-root MuiButton-root MuiButton-outlined MuiButton-outlinedPrimary MuiButton-sizeMedium MuiButton-outlinedSizeMedium MuiButton-root MuiButton-outlined MuiButton-outlinedPrimary MuiButton-sizeMedium MuiButton-outlinedSizeMedium css-lsy5n1" tabindex="0" href="/tags/c" style="margin-right:10px">c</a></div></div></div><div class="MuiGrid-root MuiGrid-item MuiGrid-grid-xs-4 css-1057s6h"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-rounded MuiPaper-elevation1 MuiCard-root css-s18byi"><div class="MuiCardContent-root css-1qw96cp"><h2 class="MuiTypography-root MuiTypography-h2 css-wdfvf3"><a href="/posts/c">c</a></h2><p class="MuiTypography-root MuiTypography-body2 css-68o8xu">日にち: <!-- -->2021-08-07</p><span class="MuiTypography-root MuiTypography-body2 css-68o8xu">たぐ: </span><a class="MuiButtonBase-root MuiButton-root MuiButton-outlined MuiButton-outlinedPrimary MuiButton-sizeMedium MuiButton-outlinedSizeMedium MuiButton-root MuiButton-outlined MuiButton-outlinedPrimary MuiButton-sizeMedium MuiButton-outlinedSizeMedium css-lsy5n1" tabindex="0" href="/tags/b" style="margin-right:10px">b</a><a class="MuiButtonBase-root MuiButton-root MuiButton-outlined MuiButton-outlinedPrimary MuiButton-sizeMedium MuiButton-outlinedSizeMedium MuiButton-root MuiButton-outlined MuiButton-outlinedPrimary MuiButton-sizeMedium MuiButton-outlinedSizeMedium css-lsy5n1" tabindex="0" href="/tags/c" style="margin-right:10px">c</a></div></div></div></div></main></div><script id="__NEXT_DATA__" type="application/json" crossorigin="">{"props":{"pageProps":{"posts":[{"title":"TripoとBlenderで姫希ひめの3Dモデルを作った","date":"2026-10-01","tags":["3D","VTuber","Blender","Tripo"],"articleMd":"\n姫希ひめの4方向の参照画像をもとに、TripoとBlenderで3D VTuberモデルを作りました。Codexと一緒に生成・修正・動作確認を繰り返して、VRM 1.0として書き出し、VRoid Hubで公開するところまで進めています。\n\n見た目を立体にするだけでも楽しいのですが、まばたきや口パク、視線、髪や服の揺れを付けると、静止画では分からなかった問題がかなり見えてきました。今回は、生成したモデルを動かせる状態へ持っていくまでの制作記録です。\n\n[VRoid Hubで姫希ひめを見る](https://hub.vroid.com/characters/2964447268666891023/models/3762699592295630385) · [Xの @himeki_princess](https://x.com/himeki_princess)\n\n![胴の色合わせまで反映した姫希ひめの全身レンダー](/images/posts/himeki-hime-tripo-vrm/full-body.png)\n\n*胴の白い布の色合わせまで反映したBlender編集版。記事中の画像は実際の3Dモデルをレンダリングしたものです。*\n\n## 一体生成から部品ごとの生成へ\n\n最初は全身をまとめたモデルも試し、その後は体・頭・髪を別々に生成した3パーツ版を調整しました。首が長い、髪のボリュームが足りない、肌が灰色っぽい、といった違いを元画像と見比べながら直しています。\n\nさらに頭と髪を一緒に生成したものも比較し、制作のベースには「体＋頭と髪のセット」を採用しました。生成時にまとめる単位と、Blenderで編集する単位は別です。頭と髪を一緒に生成しても、その後で顔・毛束・飾りなどに分け、必要な部分を選んで触れるようにしています。\n\nパーツ用の参照画像にはImagegenも使いました。元の4枚をデザインの基準にして、Tripoへ渡す正面・側面・背面などの画像を用意する流れです。途中の修正を重ねるうちに元の衣装から離れそうな箇所は、元画像に戻って参照を作り直しました。\n\n## 目と口を動かせる構造にする\n\n顔はかなり手を入れたところです。生成された顔の見た目を保ちながら、白目と虹彩を分け、白目は頭に固定して虹彩だけを眼球のボーンで動かす構造にしました。虹彩には完全な円形の画像を用意し、左右・上下に視線を動かしても欠けた部分が出にくくしています。\n\nまばたきも、単に目を細くするだけではうまくいきませんでした。半目でまぶたに段差が出たり、元の顔テクスチャの虹彩が前に出たりするため、眼窩の奥行きと閉じる途中の位置を調整。閉じたときのまつ毛は独立したメッシュにして、変形後の顔の表面に沿わせています。\n\n目の上半分の影にもこだわりました。白目と虹彩に影を重ねつつ、下半分は明るいままにし、視線を動かしても影の位置が頭に対してずれないようにしています。\n\n![白目と虹彩の上半分に影を重ねた目元の拡大](/images/posts/himeki-hime-tripo-vrm/eye-detail.png)\n\n口には暗い口腔、上の歯、舌を追加し、あいうえおの口形と連動させました。後から「口の中が暗すぎる」「笑ったときに上唇が下へ曲がって見える」といった点も修正しています。\n\n喜び・怒り・悲しみ・穏やか・驚き・笑顔・左右のウインク・片側の笑み・不満・眠い、という11種類の表情も作りました。眉、目の開き、口角は個別に調整できます。\n\n![通常と11種類の表情を並べた制作途中の一覧](/images/posts/himeki-hime-tripo-vrm/expressions.png)\n\n*9月25日時点の表情確認シート。画像内の「VRM未更新」は撮影時点の状態で、その後の公開版には表情を反映しています。口元や衣装には、この画像の後にも修正を加えています。*\n\n## 胴体とスカートを再生成する\n\n全体が動くようになってからも、体や衣装は何度か作り直しました。脚を動かすと太ももやガーターが引き伸ばされる問題は、まずボーンの影響度であるウェイトを修正。その後、下半身を独立して生成し直し、左右で異なるストッキングの高さや飾りを残して組み込みました。\n\n上半身は部分的な差し替えも試しましたが、最終的には首から腰、袖、腕、手先までをまとめて再生成しています。既存の頭側の首に位置を合わせ、30本の指ボーンを新しい手の形に合わせ直しました。首の接続、腕上げ、肘や手首、左右10本の指の個別曲げなど、17状態で変形を確認しています。\n\nスカートとエプロンもTripoで再生成し、前後の大きなリボンは別生成の独立パーツにしました。生成直後には腰や裾を塞ぐ面があったので、それを取り除き、脚が通る形に修正。裏地も追加しています。\n\n飾りが服の表面に描かれているだけだと、後から位置や色を変えたり、揺らしたりするのが難しくなります。胸や腰のリボン、ハートと羽の髪飾りなどは、個別に形や材質を調整できるようにしました。ただし、細い鎖やレースのすべてを独立した立体にしたわけではなく、生成された表面やテクスチャで表現している部分も残っています。\n\n## 肌と白い布の色をそろえる\n\n別々に生成した部品を組み合わせると、顔と体の肌色や、胴とスカートの白が少しずつ違って見えます。光沢を強くする試作もしましたが、今回は柔らかいアニメ調の陰影に寄せました。\n\n肌は顔に近い明るさと赤みに調整し、白い布に混ざった肌色や黒い斑点は範囲を絞って補正。肩・袖のフリルの角張り、背中の襟と肩ひも、太もものレース、手首・足首のリボンなどを順に直しています。\n\n最後に、胸元と袖の灰紫っぽさを弱めてスカートの白に合わせました。しわの陰影は残しつつ、全身で見たときの色の差を抑えています。\n\n形状の修正も、必要な箇所だけに絞りました。肩や袖のフリルには局所的に800頂点を追加しましたが、その後の色合わせと背面リボンの揺れの追加では頂点数を増やしていません。最新のBlender編集版は73,501頂点です。\n\n## 髪とスカートと背面リボンを揺らす\n\n揺れにはVRMのSpringBoneを使っています。骨の連なりをばねのように動かす仕組みで、髪や衣装の部分ごとに設定を分けました。\n\n| 部位 | 揺れの系統数 | 調整したこと |\n| --- | ---: | --- |\n| 髪 | 7 | 前髪、ボブ、ツインテールなどの揺れ方と体への当たり方 |\n| スカート | 12 | 腰を固定し、裾と裏地、小リボンを追従させる |\n| 背面リボン | 4 | 結び目を固定し、左右の内側と外側を別々に動かす |\n\n公開版には計23系統の揺れと、12個の当たり判定を入れました。頭や胴を動かしたときの追従、脚を上げたときの干渉などを確認しています。\n\nただし、これは骨と当たり判定による布の近似です。スカートの確認では、前への脚上げ35度や開脚25度などで表地と脚の交差を検出しなかった一方、70度の深い脚上げでは貫通や引きつれが残りました。裏地にも隠れた重なりがあり、どんな動きでも布が脚を避ける状態ではありません。\n\n## BlenderからVRMへ書き出して公開する\n\n編集の途中からは、修正するたびにVRMを出力するのをやめ、Blenderでまとめて調整してから公開版へ反映しました。比較画像と変更前のファイルを残していたので、試した結果が合わなければ前の状態へ戻せます。\n\n書き出しでは、Blenderの表示をそのまま持っていけない部分がありました。材質ノードで行った布の色補正は、照明を焼き込まずにベース色と陰影用のテクスチャへ変換。頭の座標を使っていた目の影も、頭に追従する透明メッシュと照明の影響を受けない材質へ置き換えました。\n\n表情とまばたきを組み合わせるBlenderのドライバーも、そのまま標準VRMの機能にはなりません。感情ごとの閉じ目を専用のカスタム表情として追加していますが、配信アプリ側で自動的に切り替えるには、その表情への対応付けが必要です。\n\n書き出したVRMは空のBlenderへ再読み込みし、不正な頂点とウェイト未設定の頂点がどちらも0であること、テクスチャが内包されていることを確認しました。54本のHumanoidボーン、表情、揺れの設定を検査し、ブラウザのビューアでも歩行、頭と胴の動き、閉眼、視線を確認しています。VRoid Hubへの差し替え後も3D表示を確認しました。\n\n最新の公開モデルはVRM 1.0です。制作途中にはVRM 0.xも検証しましたが、今回の最新修正を反映した公開版とは区別しています。\n\n公開名は「姫希ひめ」にし、クレジット表記を必須に設定しました。表記名は「姫希ひめ（@himeki_princess）」で、プロフィールとVRM内にもXのURLを入れています。再書き出しで戻らないよう、名前とクレジットの設定は編集用データにも反映しました。\n\n記事公開時点では全体公開・ダウンロード可ですが、他の人のアバター利用と再配布は不可の設定です。利用する際は、[VRoid Hubのモデルページ](https://hub.vroid.com/characters/2964447268666891023/models/3762699592295630385)で現在の利用条件を確認してください。\n\n## 動かしてみて分かったこと\n\n今回いちばん手がかかったのは、生成した各パーツのつなぎ目と、表情や動きが入ったときの整合でした。静止画では自然に見える目も、視線を動かして半目にすると別の問題が出てきます。衣装も、立った状態だけでなく脚を上げて確認する必要がありました。\n\nTripoで形を用意し、Imagegenで参照や補修素材を作り、Blenderで構造と動きを調整する。それぞれを行き来しながら、Codexで修正用のスクリプトや比較画像、検証記録を作って進めた制作でした。\n\n細い毛束やレースの粗さ、極端なポーズでの干渉、実際の配信アプリでのトラッキングや負荷の確認はまだ残っています。ARKitの52チャンネルへの対応も未検証です。それでも、元の4枚から表情や揺れのあるモデルを作り、VRoid Hubで見られるところまで持っていけました。\n\n[姫希ひめの3Dモデルはこちら](https://hub.vroid.com/characters/2964447268666891023/models/3762699592295630385)。制作後の様子は [@himeki_princess](https://x.com/himeki_princess) へ。\n","articleHTML":"\u003cp\u003e姫希ひめの4方向の参照画像をもとに、TripoとBlenderで3D VTuberモデルを作りました。Codexと一緒に生成・修正・動作確認を繰り返して、VRM 1.0として書き出し、VRoid Hubで公開するところまで進めています。\u003c/p\u003e\n\u003cp\u003e見た目を立体にするだけでも楽しいのですが、まばたきや口パク、視線、髪や服の揺れを付けると、静止画では分からなかった問題がかなり見えてきました。今回は、生成したモデルを動かせる状態へ持っていくまでの制作記録です。\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://hub.vroid.com/characters/2964447268666891023/models/3762699592295630385\"\u003eVRoid Hubで姫希ひめを見る\u003c/a\u003e · \u003ca href=\"https://x.com/himeki_princess\"\u003eXの @himeki_princess\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/images/posts/himeki-hime-tripo-vrm/full-body.png\" alt=\"胴の色合わせまで反映した姫希ひめの全身レンダー\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003e胴の白い布の色合わせまで反映したBlender編集版。記事中の画像は実際の3Dモデルをレンダリングしたものです。\u003c/em\u003e\u003c/p\u003e\n\u003ch2\u003e一体生成から部品ごとの生成へ\u003c/h2\u003e\n\u003cp\u003e最初は全身をまとめたモデルも試し、その後は体・頭・髪を別々に生成した3パーツ版を調整しました。首が長い、髪のボリュームが足りない、肌が灰色っぽい、といった違いを元画像と見比べながら直しています。\u003c/p\u003e\n\u003cp\u003eさらに頭と髪を一緒に生成したものも比較し、制作のベースには「体＋頭と髪のセット」を採用しました。生成時にまとめる単位と、Blenderで編集する単位は別です。頭と髪を一緒に生成しても、その後で顔・毛束・飾りなどに分け、必要な部分を選んで触れるようにしています。\u003c/p\u003e\n\u003cp\u003eパーツ用の参照画像にはImagegenも使いました。元の4枚をデザインの基準にして、Tripoへ渡す正面・側面・背面などの画像を用意する流れです。途中の修正を重ねるうちに元の衣装から離れそうな箇所は、元画像に戻って参照を作り直しました。\u003c/p\u003e\n\u003ch2\u003e目と口を動かせる構造にする\u003c/h2\u003e\n\u003cp\u003e顔はかなり手を入れたところです。生成された顔の見た目を保ちながら、白目と虹彩を分け、白目は頭に固定して虹彩だけを眼球のボーンで動かす構造にしました。虹彩には完全な円形の画像を用意し、左右・上下に視線を動かしても欠けた部分が出にくくしています。\u003c/p\u003e\n\u003cp\u003eまばたきも、単に目を細くするだけではうまくいきませんでした。半目でまぶたに段差が出たり、元の顔テクスチャの虹彩が前に出たりするため、眼窩の奥行きと閉じる途中の位置を調整。閉じたときのまつ毛は独立したメッシュにして、変形後の顔の表面に沿わせています。\u003c/p\u003e\n\u003cp\u003e目の上半分の影にもこだわりました。白目と虹彩に影を重ねつつ、下半分は明るいままにし、視線を動かしても影の位置が頭に対してずれないようにしています。\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/images/posts/himeki-hime-tripo-vrm/eye-detail.png\" alt=\"白目と虹彩の上半分に影を重ねた目元の拡大\"\u003e\u003c/p\u003e\n\u003cp\u003e口には暗い口腔、上の歯、舌を追加し、あいうえおの口形と連動させました。後から「口の中が暗すぎる」「笑ったときに上唇が下へ曲がって見える」といった点も修正しています。\u003c/p\u003e\n\u003cp\u003e喜び・怒り・悲しみ・穏やか・驚き・笑顔・左右のウインク・片側の笑み・不満・眠い、という11種類の表情も作りました。眉、目の開き、口角は個別に調整できます。\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/images/posts/himeki-hime-tripo-vrm/expressions.png\" alt=\"通常と11種類の表情を並べた制作途中の一覧\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003e9月25日時点の表情確認シート。画像内の「VRM未更新」は撮影時点の状態で、その後の公開版には表情を反映しています。口元や衣装には、この画像の後にも修正を加えています。\u003c/em\u003e\u003c/p\u003e\n\u003ch2\u003e胴体とスカートを再生成する\u003c/h2\u003e\n\u003cp\u003e全体が動くようになってからも、体や衣装は何度か作り直しました。脚を動かすと太ももやガーターが引き伸ばされる問題は、まずボーンの影響度であるウェイトを修正。その後、下半身を独立して生成し直し、左右で異なるストッキングの高さや飾りを残して組み込みました。\u003c/p\u003e\n\u003cp\u003e上半身は部分的な差し替えも試しましたが、最終的には首から腰、袖、腕、手先までをまとめて再生成しています。既存の頭側の首に位置を合わせ、30本の指ボーンを新しい手の形に合わせ直しました。首の接続、腕上げ、肘や手首、左右10本の指の個別曲げなど、17状態で変形を確認しています。\u003c/p\u003e\n\u003cp\u003eスカートとエプロンもTripoで再生成し、前後の大きなリボンは別生成の独立パーツにしました。生成直後には腰や裾を塞ぐ面があったので、それを取り除き、脚が通る形に修正。裏地も追加しています。\u003c/p\u003e\n\u003cp\u003e飾りが服の表面に描かれているだけだと、後から位置や色を変えたり、揺らしたりするのが難しくなります。胸や腰のリボン、ハートと羽の髪飾りなどは、個別に形や材質を調整できるようにしました。ただし、細い鎖やレースのすべてを独立した立体にしたわけではなく、生成された表面やテクスチャで表現している部分も残っています。\u003c/p\u003e\n\u003ch2\u003e肌と白い布の色をそろえる\u003c/h2\u003e\n\u003cp\u003e別々に生成した部品を組み合わせると、顔と体の肌色や、胴とスカートの白が少しずつ違って見えます。光沢を強くする試作もしましたが、今回は柔らかいアニメ調の陰影に寄せました。\u003c/p\u003e\n\u003cp\u003e肌は顔に近い明るさと赤みに調整し、白い布に混ざった肌色や黒い斑点は範囲を絞って補正。肩・袖のフリルの角張り、背中の襟と肩ひも、太もものレース、手首・足首のリボンなどを順に直しています。\u003c/p\u003e\n\u003cp\u003e最後に、胸元と袖の灰紫っぽさを弱めてスカートの白に合わせました。しわの陰影は残しつつ、全身で見たときの色の差を抑えています。\u003c/p\u003e\n\u003cp\u003e形状の修正も、必要な箇所だけに絞りました。肩や袖のフリルには局所的に800頂点を追加しましたが、その後の色合わせと背面リボンの揺れの追加では頂点数を増やしていません。最新のBlender編集版は73,501頂点です。\u003c/p\u003e\n\u003ch2\u003e髪とスカートと背面リボンを揺らす\u003c/h2\u003e\n\u003cp\u003e揺れにはVRMのSpringBoneを使っています。骨の連なりをばねのように動かす仕組みで、髪や衣装の部分ごとに設定を分けました。\u003c/p\u003e\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e部位\u003c/th\u003e\u003cth align=\"right\"\u003e揺れの系統数\u003c/th\u003e\u003cth\u003e調整したこと\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e髪\u003c/td\u003e\u003ctd align=\"right\"\u003e7\u003c/td\u003e\u003ctd\u003e前髪、ボブ、ツインテールなどの揺れ方と体への当たり方\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eスカート\u003c/td\u003e\u003ctd align=\"right\"\u003e12\u003c/td\u003e\u003ctd\u003e腰を固定し、裾と裏地、小リボンを追従させる\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e背面リボン\u003c/td\u003e\u003ctd align=\"right\"\u003e4\u003c/td\u003e\u003ctd\u003e結び目を固定し、左右の内側と外側を別々に動かす\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e公開版には計23系統の揺れと、12個の当たり判定を入れました。頭や胴を動かしたときの追従、脚を上げたときの干渉などを確認しています。\u003c/p\u003e\n\u003cp\u003eただし、これは骨と当たり判定による布の近似です。スカートの確認では、前への脚上げ35度や開脚25度などで表地と脚の交差を検出しなかった一方、70度の深い脚上げでは貫通や引きつれが残りました。裏地にも隠れた重なりがあり、どんな動きでも布が脚を避ける状態ではありません。\u003c/p\u003e\n\u003ch2\u003eBlenderからVRMへ書き出して公開する\u003c/h2\u003e\n\u003cp\u003e編集の途中からは、修正するたびにVRMを出力するのをやめ、Blenderでまとめて調整してから公開版へ反映しました。比較画像と変更前のファイルを残していたので、試した結果が合わなければ前の状態へ戻せます。\u003c/p\u003e\n\u003cp\u003e書き出しでは、Blenderの表示をそのまま持っていけない部分がありました。材質ノードで行った布の色補正は、照明を焼き込まずにベース色と陰影用のテクスチャへ変換。頭の座標を使っていた目の影も、頭に追従する透明メッシュと照明の影響を受けない材質へ置き換えました。\u003c/p\u003e\n\u003cp\u003e表情とまばたきを組み合わせるBlenderのドライバーも、そのまま標準VRMの機能にはなりません。感情ごとの閉じ目を専用のカスタム表情として追加していますが、配信アプリ側で自動的に切り替えるには、その表情への対応付けが必要です。\u003c/p\u003e\n\u003cp\u003e書き出したVRMは空のBlenderへ再読み込みし、不正な頂点とウェイト未設定の頂点がどちらも0であること、テクスチャが内包されていることを確認しました。54本のHumanoidボーン、表情、揺れの設定を検査し、ブラウザのビューアでも歩行、頭と胴の動き、閉眼、視線を確認しています。VRoid Hubへの差し替え後も3D表示を確認しました。\u003c/p\u003e\n\u003cp\u003e最新の公開モデルはVRM 1.0です。制作途中にはVRM 0.xも検証しましたが、今回の最新修正を反映した公開版とは区別しています。\u003c/p\u003e\n\u003cp\u003e公開名は「姫希ひめ」にし、クレジット表記を必須に設定しました。表記名は「姫希ひめ（@himeki_princess）」で、プロフィールとVRM内にもXのURLを入れています。再書き出しで戻らないよう、名前とクレジットの設定は編集用データにも反映しました。\u003c/p\u003e\n\u003cp\u003e記事公開時点では全体公開・ダウンロード可ですが、他の人のアバター利用と再配布は不可の設定です。利用する際は、\u003ca href=\"https://hub.vroid.com/characters/2964447268666891023/models/3762699592295630385\"\u003eVRoid Hubのモデルページ\u003c/a\u003eで現在の利用条件を確認してください。\u003c/p\u003e\n\u003ch2\u003e動かしてみて分かったこと\u003c/h2\u003e\n\u003cp\u003e今回いちばん手がかかったのは、生成した各パーツのつなぎ目と、表情や動きが入ったときの整合でした。静止画では自然に見える目も、視線を動かして半目にすると別の問題が出てきます。衣装も、立った状態だけでなく脚を上げて確認する必要がありました。\u003c/p\u003e\n\u003cp\u003eTripoで形を用意し、Imagegenで参照や補修素材を作り、Blenderで構造と動きを調整する。それぞれを行き来しながら、Codexで修正用のスクリプトや比較画像、検証記録を作って進めた制作でした。\u003c/p\u003e\n\u003cp\u003e細い毛束やレースの粗さ、極端なポーズでの干渉、実際の配信アプリでのトラッキングや負荷の確認はまだ残っています。ARKitの52チャンネルへの対応も未検証です。それでも、元の4枚から表情や揺れのあるモデルを作り、VRoid Hubで見られるところまで持っていけました。\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://hub.vroid.com/characters/2964447268666891023/models/3762699592295630385\"\u003e姫希ひめの3Dモデルはこちら\u003c/a\u003e。制作後の様子は \u003ca href=\"https://x.com/himeki_princess\"\u003e@himeki_princess\u003c/a\u003e へ。\u003c/p\u003e","path":"/posts/himeki-hime-tripo-vrm"},{"title":"a","date":"2021-08-07","tags":["a","b"],"articleMd":"\n[Q](/)\n[Q](https://google.com)\n工事中\n","articleHTML":"\u003cp\u003e\u003ca href=\"/\"\u003eQ\u003c/a\u003e\n\u003ca href=\"https://google.com\"\u003eQ\u003c/a\u003e\n工事中\u003c/p\u003e","path":"/posts/a"},{"title":"b","date":"2021-08-07","tags":["b","c"],"articleMd":"\n[Q](/)\n[Q](https://google.com)\n工事中\n","articleHTML":"\u003cp\u003e\u003ca href=\"/\"\u003eQ\u003c/a\u003e\n\u003ca href=\"https://google.com\"\u003eQ\u003c/a\u003e\n工事中\u003c/p\u003e","path":"/posts/b"},{"title":"c","date":"2021-08-07","tags":["b","c"],"articleMd":"\n[Q](/)\n[Q](https://google.com)\n工事中\n","articleHTML":"\u003cp\u003e\u003ca href=\"/\"\u003eQ\u003c/a\u003e\n\u003ca href=\"https://google.com\"\u003eQ\u003c/a\u003e\n工事中\u003c/p\u003e","path":"/posts/c"}]},"__N_SSG":true},"page":"/posts","query":{},"buildId":"YQpa06Ye3YMTE_knWea9o","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
