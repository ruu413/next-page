uber</a><a class="MuiButtonBase-root MuiButton-root MuiButton-outlined MuiButton-outlinedPrimary MuiButton-sizeMedium MuiButton-outlinedSizeMedium MuiButton-root MuiButton-outlined MuiButton-outlinedPrimary MuiButton-sizeMedium MuiButton-outlinedSizeMedium css-lsy5n1" tabindex="0" href="/tags/Blender" style="margin-right:10px">Blender</a><a class="MuiButtonBase-root MuiButton-root MuiButton-outlined MuiButton-outlinedPrimary MuiButton-sizeMedium MuiButton-outlinedSizeMedium MuiButton-root MuiButton-outlined MuiButton-outlinedPrimary MuiButton-sizeMedium MuiButton-outlinedSizeMedium css-lsy5n1" tabindex="0" href="/tags/Tripo" style="margin-right:10px">Tripo</a></div></div></div></div></main></div><script id="__NEXT_DATA__" type="application/json" crossorigin="">{"props":{"pageProps":{"tag":"Blender","posts":[{"title":"TripoとBlenderで姫希ひめの3Dモデルを作った","date":"2026-10-01","tags":["3D","VTuber","Blender","Tripo"],"articleMd":"\n姫希ひめの4方向の参照画像をもとに、TripoとBlenderで3D VTuberモデルを作りました。Codexと一緒に生成・修正・動作確認を繰り返して、VRM 1.0として書き出し、VRoid Hubで公開するところまで進めています。\n\n見た目を立体にするだけでも楽しいのですが、まばたきや口パク、視線、髪や服の揺れを付けると、静止画では分からなかった問題がかなり見えてきました。今回は、生成したモデルを動かせる状態へ持っていくまでの制作記録です。うまくいかずに戻した試作や、書き出して初めて気づいた不具合も紹介します。\n\n[VRoid Hubで姫希ひめを見る](https://hub.vroid.com/characters/2964447268666891023/models/3762699592295630385) · [Xの @himeki_princess](https://x.com/himeki_princess)\n\n![胴の色合わせまで反映した姫希ひめの全身レンダー](/images/posts/himeki-hime-tripo-vrm/full-body.png)\n\n*胴の白い布の色合わせまで反映したBlender編集版。記事中の画像は実際の3Dモデルをレンダリングしたものです。*\n\n## 一体生成から部品ごとの生成へ\n\n最初は全身を一回でまとめて生成しましたが、それだけで使えるVTuberモデルにはなりませんでした。次に体・頭・髪を別々に生成した3パーツ版も試しましたが、首が長い、髪のボリュームが足りない、といった組み合わせの問題が出ています。一度は一体版の方がよさそうだと戻り、その後また3パーツ版を調整する、という行き来もありました。\n\nさらに頭と髪を一緒に生成したものも比較し、制作のベースには「体＋頭と髪のセット」を採用しました。生成時にまとめる単位と、Blenderで編集する単位は別です。頭と髪を一緒に生成しても、その後で顔・毛束・飾りなどに分け、必要な部分を選んで触れるようにしています。\n\nパーツ用の参照画像にはImagegenも使いました。元の4枚をデザインの基準にして、Tripoへ渡す正面・側面・背面などの画像を用意する流れです。途中の修正を重ねるうちに元の衣装から離れそうな箇所は、元画像に戻って参照を作り直しました。\n\n## 目と口を動かせる構造にする\n\n顔はかなり手を入れたところです。生成された顔の見た目を保ちながら、白目と虹彩を分け、白目は頭に固定して虹彩だけを眼球のボーンで動かす構造にしました。虹彩には完全な円形の画像を用意し、左右・上下に視線を動かしても欠けた部分が出にくくしています。\n\nまばたきも、単に目を細くするだけではうまくいきませんでした。半目でまぶたに段差が出たり、元の顔テクスチャの虹彩が前に出たりするため、眼窩の奥行きと閉じる途中の位置を調整。閉じたときのまつ毛は独立したメッシュにして、変形後の顔の表面に沿わせています。\n\n目の上半分の影にもこだわりました。白目と虹彩に影を重ねつつ、下半分は明るいままにし、視線を動かしても影の位置が頭に対してずれないようにしています。\n\n![白目と虹彩の上半分に影を重ねた目元の拡大](/images/posts/himeki-hime-tripo-vrm/eye-detail.png)\n\n口には暗い口腔、上の歯、舌を追加し、あいうえおの口形と連動させました。後から「口の中が暗すぎる」「笑ったときに上唇が下へ曲がって見える」といった点も修正しています。\n\n喜び・怒り・悲しみ・穏やか・驚き・笑顔・左右のウインク・片側の笑み・不満・眠い、という11種類の表情も作りました。眉、目の開き、口角は個別に調整できます。\n\n![通常と11種類の表情を並べた制作途中の一覧](/images/posts/himeki-hime-tripo-vrm/expressions.png)\n\n*9月25日時点の表情確認シート。画像内の「VRM未更新」は撮影時点の状態で、その後の公開版には表情を反映しています。口元や衣装には、この画像の後にも修正を加えています。*\n\n## 胴体とスカートを再生成する\n\n全体が動くようになってからも、体や衣装は何度か作り直しました。脚を動かすと太ももやガーターが引き伸ばされる問題は、まずボーンの影響度であるウェイトを修正。その後、下半身を独立して生成し直し、左右で異なるストッキングの高さや飾りを残して組み込みました。\n\n上半身は部分的な差し替えも試しましたが、最終的には首から腰、袖、腕、手先までをまとめて再生成しています。既存の頭側の首に位置を合わせ、30本の指ボーンを新しい手の形に合わせ直しました。首の接続、腕上げ、肘や手首、左右10本の指の個別曲げなど、17状態で変形を確認しています。\n\nスカートとエプロンもTripoで再生成し、前後の大きなリボンは別生成の独立パーツにしました。生成直後には腰や裾を塞ぐ面があったので、それを取り除き、脚が通る形に修正。裏地も追加しています。\n\n飾りが服の表面に描かれているだけだと、後から位置や色を変えたり、揺らしたりするのが難しくなります。胸や腰のリボン、ハートと羽の髪飾りなどは、個別に形や材質を調整できるようにしました。ただし、細い鎖やレースのすべてを独立した立体にしたわけではなく、生成された表面やテクスチャで表現している部分も残っています。\n\n## 肌と白い布の色をそろえる\n\n別々に生成した部品を組み合わせると、顔と体の肌色や、胴とスカートの白が少しずつ違って見えます。光沢を強くする試作もしましたが、今回は柔らかいアニメ調の陰影に寄せました。\n\n肌は顔に近い明るさと赤みに調整し、白い布に混ざった肌色や黒い斑点は範囲を絞って補正。肩・袖のフリルの角張り、背中の襟と肩ひも、太もものレース、手首・足首のリボンなどを順に直しています。\n\n最後に、胸元と袖の灰紫っぽさを弱めてスカートの白に合わせました。しわの陰影は残しつつ、全身で見たときの色の差を抑えています。\n\n形状の修正も、必要な箇所だけに絞りました。肩や袖のフリルには局所的に800頂点を追加しましたが、その後の色合わせと背面リボンの揺れの追加では頂点数を増やしていません。最新のBlender編集版は73,501頂点です。\n\n## 髪とスカートと背面リボンを揺らす\n\n揺れにはVRMのSpringBoneを使っています。骨の連なりをばねのように動かす仕組みで、髪や衣装の部分ごとに設定を分けました。\n\n| 部位 | 揺れの系統数 | 調整したこと |\n| --- | ---: | --- |\n| 髪 | 7 | 前髪、ボブ、ツインテールなどの揺れ方と体への当たり方 |\n| スカート | 12 | 腰を固定し、裾と裏地、小リボンを追従させる |\n| 背面リボン | 4 | 結び目を固定し、左右の内側と外側を別々に動かす |\n\n公開版には計23系統の揺れと、12個の当たり判定を入れました。頭や胴を動かしたときの追従、脚を上げたときの干渉などを確認しています。\n\nただし、これは骨と当たり判定による布の近似です。スカートの確認では、前への脚上げ35度や開脚25度などで表地と脚の交差を検出しなかった一方、70度の深い脚上げでは貫通や引きつれが残りました。裏地にも隠れた重なりがあり、どんな動きでも布が脚を避ける状態ではありません。\n\n## BlenderからVRMへ書き出して公開する\n\n編集の途中からは、修正するたびにVRMを出力するのをやめ、Blenderでまとめて調整してから公開版へ反映しました。比較画像と変更前のファイルを残していたので、試した結果が合わなければ前の状態へ戻せます。\n\n書き出しでは、Blenderの表示をそのまま持っていけない部分がありました。材質ノードで行った布の色補正は、照明を焼き込まずにベース色と陰影用のテクスチャへ変換。頭の座標を使っていた目の影も、頭に追従する透明メッシュと照明の影響を受けない材質へ置き換えました。\n\n表情とまばたきを組み合わせるBlenderのドライバーも、そのまま標準VRMの機能にはなりません。感情ごとの閉じ目を専用のカスタム表情として追加していますが、配信アプリ側で自動的に切り替えるには、その表情への対応付けが必要です。\n\n書き出したVRMは空のBlenderへ再読み込みし、不正な頂点とウェイト未設定の頂点がどちらも0であること、テクスチャが内包されていることを確認しました。54本のHumanoidボーン、表情、揺れの設定を検査し、ブラウザのビューアでも歩行、頭と胴の動き、閉眼、視線を確認しています。VRoid Hubへの差し替え後も3D表示を確認しました。\n\n最新の公開モデルはVRM 1.0です。制作途中にはVRM 0.xも検証しましたが、今回の最新修正を反映した公開版とは区別しています。\n\n公開名は「姫希ひめ」にし、クレジット表記を必須に設定しました。表記名は「姫希ひめ（@himeki_princess）」で、プロフィールとVRM内にもXのURLを入れています。再書き出しで戻らないよう、名前とクレジットの設定は編集用データにも反映しました。\n\n記事公開時点では全体公開・ダウンロード可ですが、他の人のアバター利用と再配布は不可の設定です。利用する際は、[VRoid Hubのモデルページ](https://hub.vroid.com/characters/2964447268666891023/models/3762699592295630385)で現在の利用条件を確認してください。\n\n## 失敗したところとやり直したこと\n\n大きくやり直したのは、そもそもモデルをどんな単位で生成するか、という部分でした。全身を一回で作る、顔と髪を分ける、腕を作り直さず胴だけ差し替える。それぞれ試しましたが、今回のモデルではそのまま採用できず、生成範囲や組み込み方を変えています。まずその3つ、その後に細部の修正で起きた失敗を紹介します。\n\n### 全身を一回で作っても仕上げは済まなかった\n\n最初の一体版は、全身の4方向画像からまとめて生成したモデルです。3パーツ版と比べて、一度はこちらを使う方針にも戻しました。ただ、編集を進めると髪の一部に肌色が混ざっていることや、肌が不健康に見えることが気になりました。\n\n顔・髪・体などが一つのメッシュに入っていたため、Blenderで領域を選り分け、髪の色を補正し、表情や髪の揺れを付ける作業が必要でした。全身を一回で生成できても、各部を狙いどおりに動かしたり、見た目を直したりする工程は残ります。今回はこの一体版を最終モデルにする方法を見送り、部品ごとの生成へ戻りました。\n\n![全身を一括生成したモデルを元に分離と表情付けを試していた段階の顔](/images/posts/himeki-hime-tripo-vrm/monolithic-trial.png)\n\n*一体版を元に、分離や表情付けを試していた途中のレンダー。現在の公開モデルとは顔や髪の質感がかなり違います。*\n\n### 顔と髪を別生成したら合わせ直しが増えた\n\n体・頭・髪を別々に生成すれば、それぞれを作り込みやすくなると考えて試しました。各パーツに4方向の参照を用意しましたが、組み合わせると首が長く、髪は元画像より小さく見え、髪飾りも重複していました。後頭部には頭皮が見える箇所もありました。\n\n頭と髪を約4.2cm下げて首を短くし、ボブやツインテールの幅を調整。後頭部のカバーを足し、重複した飾りも取り除いています。分割したことで、顔と髪の寸法や接する位置を合わせる作業が増えました。\n\n![体と頭と髪を別々に生成して仮組みした初期の3パーツ版](/images/posts/himeki-hime-tripo-vrm/three-part-trial.png)\n\n*3パーツ版の初期の仮組み。ここから首の長さや髪の大きさを調整しました。*\n\nこの版も動くVRMの試作までは進めましたが、最終的な制作のベースには、頭と髪を一緒に生成した版を採用しました。その後にBlenderで顔・髪・飾りを分けています。「別々に生成する」ことと「後から別々に編集できるようにする」ことを、分けて考えるようになった工程です。\n\n### 腕を作り直さず胴だけ差し替える案もやり直した\n\n上半身では、腕を残して胴だけを新しくし、既存の腕や袖につなぐ方針を試しました。しかし、胴を差し替えれば終わりにはならず、胸や肩の比率、首や腕との接続を何度も合わせ直すことになりました。一度は胴・胸・肩・腕を差し替え前へ戻し、その後、生成した胴を以前の比率に合わせて組み込み直しています。\n\n途中では生成済みの肩と短い上腕も使い、元の袖・前腕・手を残す構成に変更しました。上腕の太さを元の腕に合わせ、接続部を袖の内側へ収める調整もしています。\n\n最終的には元の4枚から参照画像を作り直し、首から胴、腕、袖、手先までをまとめて再生成しました。顔・表情・髪と採用済みの下半身を残しつつ、上半身を一続きの範囲で作り直した形です。今回の肩や腕では、接続箇所ごとに合わせる方法から、生成する範囲そのものを広げる方法へ切り替えることになりました。\n\n### 衣装を一から作り直す案を撤回した\n\n生成された衣装を整える途中で、Blender側で衣装を一から作り直す試作に進んだことがありました。ただ、この方向は採用せず、作り直し前のモデルへ戻しています。試作の形状と材質も、使うモデルには残していません。\n\nその時点では、既存の形状を活かして、気になる部分だけを直す方針に切り替えました。後にスカートをTripoで再生成したときも、元の参照画像を基準にし、部品ごとに比較して組み込む手順を取りました。作り直す範囲を広げる前に、どの部分を残したいか決めておく必要がありました。\n\n### インナーを足したら太ももを覆いすぎた\n\nスカートの下の破綻を補うため、長めのインナーを追加したところ、太ももの露出を覆いすぎてしまいました。元の衣装の見え方を変えてしまうため、この形状と脚の付け根の変更は取り消し、脚の形状とウェイトを元へ戻しています。\n\n短い下着をBlenderで補う別案も採用せず、最終的にはTripoで腰から脚までを再生成しました。その参照作りでも、左右対称の花柄やおそろいの太ももバンドへ寄った案は不採用にしています。元画像の左右で異なるストッキングの高さや片側のバンドを守ることが、修正の基準になりました。\n\n### 白さや光沢を強めすぎた\n\n肌色や白い布の色むらを直すときにも、調整を強くしすぎました。白い色見本を混ぜる割合を90%にした試作では、布の弱い陰影や折り目が薄くなっています。そこから混合を62%へ下げ、白の明るさも少し抑えて、立体感を戻しました。\n\n![左は白さを強めすぎた試作で右は明るさを抑えて布の陰影を戻した状態](/images/posts/himeki-hime-tripo-vrm/white-rebalance.png)\n\n*9月25日時点の比較。左が白を強めた試作、右が再調整後です。同じ照明で比較しており、現在の公開版より前の衣装です。画像内の「VRM未更新」も、この時点の状態を示しています。*\n\n光沢を強めたPBR材質の試作も、今回目指した柔らかいアニメ調には採用しませんでした。元のアニメ調へ戻し、布の凹凸を強調するノーマルの強度を下げています。色をきれいにすることと、しわや重なりを読み取れるようにすることは、両方を見ながら調整する必要がありました。\n\n### 新しい下半身の後ろに古いパーツが残っていた\n\n下半身の再生成後、古い脚やガーターの一部をスカートの裏地と取り違えて残していました。新しい太ももの後ろに旧モデルの断片が重なり、脚を動かしてもその場に残る部分があった、という組み込み時のミスです。\n\n調べ直して古い下半身の残骸を取り除き、この修正では1,128頂点を削除しました。新しい下半身と元の靴、足首の飾りはそのまま保持しています。部品名だけでは判断できず、背面や脚を動かした状態で、実際にどの面が残っているかを確認する必要がありました。\n\n### Blenderで動く口内がVRMでは無効になった\n\n制作途中のVRM 0.x出力では、Blenderで動いていた口内のモーフが、書き出すと無効になる問題がありました。口内のモーフは、口を開けるときに歯や舌などの形を変えるためのデータです。\n\nこのときは書き出し用の一時シーンだけでドライバーを外して修正し、編集用のBlenderには元の連動設定を残しました。その後、VRMを再読み込みし、ブラウザのビューアでも開口・閉口を確認しています。編集画面で動いていることに加えて、書き出したファイルでも同じ動作を確かめる必要がありました。これは途中で検証した互換版の話で、最新の公開モデルはVRM 1.0です。\n\n## 動かしてみて分かったこと\n\n今回いちばん手がかかったのは、生成した各パーツのつなぎ目と、表情や動きが入ったときの整合でした。頭と髪、胴と腕のように形が連続する部分は、生成時にまとめ、その後で編集用に分ける進め方へ落ち着いています。静止画では自然に見える目も、視線を動かして半目にすると別の問題が出てきます。衣装も、立った状態だけでなく脚を上げて確認する必要がありました。\n\nTripoで形を用意し、Imagegenで参照や補修素材を作り、Blenderで構造と動きを調整する。それぞれを行き来しながら、Codexで修正用のスクリプトや比較画像、検証記録を作って進めた制作でした。\n\n細い毛束やレースの粗さ、極端なポーズでの干渉、実際の配信アプリでのトラッキングや負荷の確認はまだ残っています。ARKitの52チャンネルへの対応も未検証です。それでも、元の4枚から表情や揺れのあるモデルを作り、VRoid Hubで見られるところまで持っていけました。\n\n[姫希ひめの3Dモデルはこちら](https://hub.vroid.com/characters/2964447268666891023/models/3762699592295630385)。制作後の様子は [@himeki_princess](https://x.com/himeki_princess) へ。\n","articleHTML":"\u003cp\u003e姫希ひめの4方向の参照画像をもとに、TripoとBlenderで3D VTuberモデルを作りました。Codexと一緒に生成・修正・動作確認を繰り返して、VRM 1.0として書き出し、VRoid Hubで公開するところまで進めています。\u003c/p\u003e\n\u003cp\u003e見た目を立体にするだけでも楽しいのですが、まばたきや口パク、視線、髪や服の揺れを付けると、静止画では分からなかった問題がかなり見えてきました。今回は、生成したモデルを動かせる状態へ持っていくまでの制作記録です。うまくいかずに戻した試作や、書き出して初めて気づいた不具合も紹介します。\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://hub.vroid.com/characters/2964447268666891023/models/3762699592295630385\"\u003eVRoid Hubで姫希ひめを見る\u003c/a\u003e · \u003ca href=\"https://x.com/himeki_princess\"\u003eXの @himeki_princess\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/images/posts/himeki-hime-tripo-vrm/full-body.png\" alt=\"胴の色合わせまで反映した姫希ひめの全身レンダー\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003e胴の白い布の色合わせまで反映したBlender編集版。記事中の画像は実際の3Dモデルをレンダリングしたものです。\u003c/em\u003e\u003c/p\u003e\n\u003ch2\u003e一体生成から部品ごとの生成へ\u003c/h2\u003e\n\u003cp\u003e最初は全身を一回でまとめて生成しましたが、それだけで使えるVTuberモデルにはなりませんでした。次に体・頭・髪を別々に生成した3パーツ版も試しましたが、首が長い、髪のボリュームが足りない、といった組み合わせの問題が出ています。一度は一体版の方がよさそうだと戻り、その後また3パーツ版を調整する、という行き来もありました。\u003c/p\u003e\n\u003cp\u003eさらに頭と髪を一緒に生成したものも比較し、制作のベースには「体＋頭と髪のセット」を採用しました。生成時にまとめる単位と、Blenderで編集する単位は別です。頭と髪を一緒に生成しても、その後で顔・毛束・飾りなどに分け、必要な部分を選んで触れるようにしています。\u003c/p\u003e\n\u003cp\u003eパーツ用の参照画像にはImagegenも使いました。元の4枚をデザインの基準にして、Tripoへ渡す正面・側面・背面などの画像を用意する流れです。途中の修正を重ねるうちに元の衣装から離れそうな箇所は、元画像に戻って参照を作り直しました。\u003c/p\u003e\n\u003ch2\u003e目と口を動かせる構造にする\u003c/h2\u003e\n\u003cp\u003e顔はかなり手を入れたところです。生成された顔の見た目を保ちながら、白目と虹彩を分け、白目は頭に固定して虹彩だけを眼球のボーンで動かす構造にしました。虹彩には完全な円形の画像を用意し、左右・上下に視線を動かしても欠けた部分が出にくくしています。\u003c/p\u003e\n\u003cp\u003eまばたきも、単に目を細くするだけではうまくいきませんでした。半目でまぶたに段差が出たり、元の顔テクスチャの虹彩が前に出たりするため、眼窩の奥行きと閉じる途中の位置を調整。閉じたときのまつ毛は独立したメッシュにして、変形後の顔の表面に沿わせています。\u003c/p\u003e\n\u003cp\u003e目の上半分の影にもこだわりました。白目と虹彩に影を重ねつつ、下半分は明るいままにし、視線を動かしても影の位置が頭に対してずれないようにしています。\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/images/posts/himeki-hime-tripo-vrm/eye-detail.png\" alt=\"白目と虹彩の上半分に影を重ねた目元の拡大\"\u003e\u003c/p\u003e\n\u003cp\u003e口には暗い口腔、上の歯、舌を追加し、あいうえおの口形と連動させました。後から「口の中が暗すぎる」「笑ったときに上唇が下へ曲がって見える」といった点も修正しています。\u003c/p\u003e\n\u003cp\u003e喜び・怒り・悲しみ・穏やか・驚き・笑顔・左右のウインク・片側の笑み・不満・眠い、という11種類の表情も作りました。眉、目の開き、口角は個別に調整できます。\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/images/posts/himeki-hime-tripo-vrm/expressions.png\" alt=\"通常と11種類の表情を並べた制作途中の一覧\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003e9月25日時点の表情確認シート。画像内の「VRM未更新」は撮影時点の状態で、その後の公開版には表情を反映しています。口元や衣装には、この画像の後にも修正を加えています。\u003c/em\u003e\u003c/p\u003e\n\u003ch2\u003e胴体とスカートを再生成する\u003c/h2\u003e\n\u003cp\u003e全体が動くようになってからも、体や衣装は何度か作り直しました。脚を動かすと太ももやガーターが引き伸ばされる問題は、まずボーンの影響度であるウェイトを修正。その後、下半身を独立して生成し直し、左右で異なるストッキングの高さや飾りを残して組み込みました。\u003c/p\u003e\n\u003cp\u003e上半身は部分的な差し替えも試しましたが、最終的には首から腰、袖、腕、手先までをまとめて再生成しています。既存の頭側の首に位置を合わせ、30本の指ボーンを新しい手の形に合わせ直しました。首の接続、腕上げ、肘や手首、左右10本の指の個別曲げなど、17状態で変形を確認しています。\u003c/p\u003e\n\u003cp\u003eスカートとエプロンもTripoで再生成し、前後の大きなリボンは別生成の独立パーツにしました。生成直後には腰や裾を塞ぐ面があったので、それを取り除き、脚が通る形に修正。裏地も追加しています。\u003c/p\u003e\n\u003cp\u003e飾りが服の表面に描かれているだけだと、後から位置や色を変えたり、揺らしたりするのが難しくなります。胸や腰のリボン、ハートと羽の髪飾りなどは、個別に形や材質を調整できるようにしました。ただし、細い鎖やレースのすべてを独立した立体にしたわけではなく、生成された表面やテクスチャで表現している部分も残っています。\u003c/p\u003e\n\u003ch2\u003e肌と白い布の色をそろえる\u003c/h2\u003e\n\u003cp\u003e別々に生成した部品を組み合わせると、顔と体の肌色や、胴とスカートの白が少しずつ違って見えます。光沢を強くする試作もしましたが、今回は柔らかいアニメ調の陰影に寄せました。\u003c/p\u003e\n\u003cp\u003e肌は顔に近い明るさと赤みに調整し、白い布に混ざった肌色や黒い斑点は範囲を絞って補正。肩・袖のフリルの角張り、背中の襟と肩ひも、太もものレース、手首・足首のリボンなどを順に直しています。\u003c/p\u003e\n\u003cp\u003e最後に、胸元と袖の灰紫っぽさを弱めてスカートの白に合わせました。しわの陰影は残しつつ、全身で見たときの色の差を抑えています。\u003c/p\u003e\n\u003cp\u003e形状の修正も、必要な箇所だけに絞りました。肩や袖のフリルには局所的に800頂点を追加しましたが、その後の色合わせと背面リボンの揺れの追加では頂点数を増やしていません。最新のBlender編集版は73,501頂点です。\u003c/p\u003e\n\u003ch2\u003e髪とスカートと背面リボンを揺らす\u003c/h2\u003e\n\u003cp\u003e揺れにはVRMのSpringBoneを使っています。骨の連なりをばねのように動かす仕組みで、髪や衣装の部分ごとに設定を分けました。\u003c/p\u003e\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e部位\u003c/th\u003e\u003cth align=\"right\"\u003e揺れの系統数\u003c/th\u003e\u003cth\u003e調整したこと\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e髪\u003c/td\u003e\u003ctd align=\"right\"\u003e7\u003c/td\u003e\u003ctd\u003e前髪、ボブ、ツインテールなどの揺れ方と体への当たり方\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eスカート\u003c/td\u003e\u003ctd align=\"right\"\u003e12\u003c/td\u003e\u003ctd\u003e腰を固定し、裾と裏地、小リボンを追従させる\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e背面リボン\u003c/td\u003e\u003ctd align=\"right\"\u003e4\u003c/td\u003e\u003ctd\u003e結び目を固定し、左右の内側と外側を別々に動かす\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e公開版には計23系統の揺れと、12個の当たり判定を入れました。頭や胴を動かしたときの追従、脚を上げたときの干渉などを確認しています。\u003c/p\u003e\n\u003cp\u003eただし、これは骨と当たり判定による布の近似です。スカートの確認では、前への脚上げ35度や開脚25度などで表地と脚の交差を検出しなかった一方、70度の深い脚上げでは貫通や引きつれが残りました。裏地にも隠れた重なりがあり、どんな動きでも布が脚を避ける状態ではありません。\u003c/p\u003e\n\u003ch2\u003eBlenderからVRMへ書き出して公開する\u003c/h2\u003e\n\u003cp\u003e編集の途中からは、修正するたびにVRMを出力するのをやめ、Blenderでまとめて調整してから公開版へ反映しました。比較画像と変更前のファイルを残していたので、試した結果が合わなければ前の状態へ戻せます。\u003c/p\u003e\n\u003cp\u003e書き出しでは、Blenderの表示をそのまま持っていけない部分がありました。材質ノードで行った布の色補正は、照明を焼き込まずにベース色と陰影用のテクスチャへ変換。頭の座標を使っていた目の影も、頭に追従する透明メッシュと照明の影響を受けない材質へ置き換えました。\u003c/p\u003e\n\u003cp\u003e表情とまばたきを組み合わせるBlenderのドライバーも、そのまま標準VRMの機能にはなりません。感情ごとの閉じ目を専用のカスタム表情として追加していますが、配信アプリ側で自動的に切り替えるには、その表情への対応付けが必要です。\u003c/p\u003e\n\u003cp\u003e書き出したVRMは空のBlenderへ再読み込みし、不正な頂点とウェイト未設定の頂点がどちらも0であること、テクスチャが内包されていることを確認しました。54本のHumanoidボーン、表情、揺れの設定を検査し、ブラウザのビューアでも歩行、頭と胴の動き、閉眼、視線を確認しています。VRoid Hubへの差し替え後も3D表示を確認しました。\u003c/p\u003e\n\u003cp\u003e最新の公開モデルはVRM 1.0です。制作途中にはVRM 0.xも検証しましたが、今回の最新修正を反映した公開版とは区別しています。\u003c/p\u003e\n\u003cp\u003e公開名は「姫希ひめ」にし、クレジット表記を必須に設定しました。表記名は「姫希ひめ（@himeki_princess）」で、プロフィールとVRM内にもXのURLを入れています。再書き出しで戻らないよう、名前とクレジットの設定は編集用データにも反映しました。\u003c/p\u003e\n\u003cp\u003e記事公開時点では全体公開・ダウンロード可ですが、他の人のアバター利用と再配布は不可の設定です。利用する際は、\u003ca href=\"https://hub.vroid.com/characters/2964447268666891023/models/3762699592295630385\"\u003eVRoid Hubのモデルページ\u003c/a\u003eで現在の利用条件を確認してください。\u003c/p\u003e\n\u003ch2\u003e失敗したところとやり直したこと\u003c/h2\u003e\n\u003cp\u003e大きくやり直したのは、そもそもモデルをどんな単位で生成するか、という部分でした。全身を一回で作る、顔と髪を分ける、腕を作り直さず胴だけ差し替える。それぞれ試しましたが、今回のモデルではそのまま採用できず、生成範囲や組み込み方を変えています。まずその3つ、その後に細部の修正で起きた失敗を紹介します。\u003c/p\u003e\n\u003ch3\u003e全身を一回で作っても仕上げは済まなかった\u003c/h3\u003e\n\u003cp\u003e最初の一体版は、全身の4方向画像からまとめて生成したモデルです。3パーツ版と比べて、一度はこちらを使う方針にも戻しました。ただ、編集を進めると髪の一部に肌色が混ざっていることや、肌が不健康に見えることが気になりました。\u003c/p\u003e\n\u003cp\u003e顔・髪・体などが一つのメッシュに入っていたため、Blenderで領域を選り分け、髪の色を補正し、表情や髪の揺れを付ける作業が必要でした。全身を一回で生成できても、各部を狙いどおりに動かしたり、見た目を直したりする工程は残ります。今回はこの一体版を最終モデルにする方法を見送り、部品ごとの生成へ戻りました。\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/images/posts/himeki-hime-tripo-vrm/monolithic-trial.png\" alt=\"全身を一括生成したモデルを元に分離と表情付けを試していた段階の顔\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003e一体版を元に、分離や表情付けを試していた途中のレンダー。現在の公開モデルとは顔や髪の質感がかなり違います。\u003c/em\u003e\u003c/p\u003e\n\u003ch3\u003e顔と髪を別生成したら合わせ直しが増えた\u003c/h3\u003e\n\u003cp\u003e体・頭・髪を別々に生成すれば、それぞれを作り込みやすくなると考えて試しました。各パーツに4方向の参照を用意しましたが、組み合わせると首が長く、髪は元画像より小さく見え、髪飾りも重複していました。後頭部には頭皮が見える箇所もありました。\u003c/p\u003e\n\u003cp\u003e頭と髪を約4.2cm下げて首を短くし、ボブやツインテールの幅を調整。後頭部のカバーを足し、重複した飾りも取り除いています。分割したことで、顔と髪の寸法や接する位置を合わせる作業が増えました。\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/images/posts/himeki-hime-tripo-vrm/three-part-trial.png\" alt=\"体と頭と髪を別々に生成して仮組みした初期の3パーツ版\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003e3パーツ版の初期の仮組み。ここから首の長さや髪の大きさを調整しました。\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eこの版も動くVRMの試作までは進めましたが、最終的な制作のベースには、頭と髪を一緒に生成した版を採用しました。その後にBlenderで顔・髪・飾りを分けています。「別々に生成する」ことと「後から別々に編集できるようにする」ことを、分けて考えるようになった工程です。\u003c/p\u003e\n\u003ch3\u003e腕を作り直さず胴だけ差し替える案もやり直した\u003c/h3\u003e\n\u003cp\u003e上半身では、腕を残して胴だけを新しくし、既存の腕や袖につなぐ方針を試しました。しかし、胴を差し替えれば終わりにはならず、胸や肩の比率、首や腕との接続を何度も合わせ直すことになりました。一度は胴・胸・肩・腕を差し替え前へ戻し、その後、生成した胴を以前の比率に合わせて組み込み直しています。\u003c/p\u003e\n\u003cp\u003e途中では生成済みの肩と短い上腕も使い、元の袖・前腕・手を残す構成に変更しました。上腕の太さを元の腕に合わせ、接続部を袖の内側へ収める調整もしています。\u003c/p\u003e\n\u003cp\u003e最終的には元の4枚から参照画像を作り直し、首から胴、腕、袖、手先までをまとめて再生成しました。顔・表情・髪と採用済みの下半身を残しつつ、上半身を一続きの範囲で作り直した形です。今回の肩や腕では、接続箇所ごとに合わせる方法から、生成する範囲そのものを広げる方法へ切り替えることになりました。\u003c/p\u003e\n\u003ch3\u003e衣装を一から作り直す案を撤回した\u003c/h3\u003e\n\u003cp\u003e生成された衣装を整える途中で、Blender側で衣装を一から作り直す試作に進んだことがありました。ただ、この方向は採用せず、作り直し前のモデルへ戻しています。試作の形状と材質も、使うモデルには残していません。\u003c/p\u003e\n\u003cp\u003eその時点では、既存の形状を活かして、気になる部分だけを直す方針に切り替えました。後にスカートをTripoで再生成したときも、元の参照画像を基準にし、部品ごとに比較して組み込む手順を取りました。作り直す範囲を広げる前に、どの部分を残したいか決めておく必要がありました。\u003c/p\u003e\n\u003ch3\u003eインナーを足したら太ももを覆いすぎた\u003c/h3\u003e\n\u003cp\u003eスカートの下の破綻を補うため、長めのインナーを追加したところ、太ももの露出を覆いすぎてしまいました。元の衣装の見え方を変えてしまうため、この形状と脚の付け根の変更は取り消し、脚の形状とウェイトを元へ戻しています。\u003c/p\u003e\n\u003cp\u003e短い下着をBlenderで補う別案も採用せず、最終的にはTripoで腰から脚までを再生成しました。その参照作りでも、左右対称の花柄やおそろいの太ももバンドへ寄った案は不採用にしています。元画像の左右で異なるストッキングの高さや片側のバンドを守ることが、修正の基準になりました。\u003c/p\u003e\n\u003ch3\u003e白さや光沢を強めすぎた\u003c/h3\u003e\n\u003cp\u003e肌色や白い布の色むらを直すときにも、調整を強くしすぎました。白い色見本を混ぜる割合を90%にした試作では、布の弱い陰影や折り目が薄くなっています。そこから混合を62%へ下げ、白の明るさも少し抑えて、立体感を戻しました。\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/images/posts/himeki-hime-tripo-vrm/white-rebalance.png\" alt=\"左は白さを強めすぎた試作で右は明るさを抑えて布の陰影を戻した状態\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003e9月25日時点の比較。左が白を強めた試作、右が再調整後です。同じ照明で比較しており、現在の公開版より前の衣装です。画像内の「VRM未更新」も、この時点の状態を示しています。\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e光沢を強めたPBR材質の試作も、今回目指した柔らかいアニメ調には採用しませんでした。元のアニメ調へ戻し、布の凹凸を強調するノーマルの強度を下げています。色をきれいにすることと、しわや重なりを読み取れるようにすることは、両方を見ながら調整する必要がありました。\u003c/p\u003e\n\u003ch3\u003e新しい下半身の後ろに古いパーツが残っていた\u003c/h3\u003e\n\u003cp\u003e下半身の再生成後、古い脚やガーターの一部をスカートの裏地と取り違えて残していました。新しい太ももの後ろに旧モデルの断片が重なり、脚を動かしてもその場に残る部分があった、という組み込み時のミスです。\u003c/p\u003e\n\u003cp\u003e調べ直して古い下半身の残骸を取り除き、この修正では1,128頂点を削除しました。新しい下半身と元の靴、足首の飾りはそのまま保持しています。部品名だけでは判断できず、背面や脚を動かした状態で、実際にどの面が残っているかを確認する必要がありました。\u003c/p\u003e\n\u003ch3\u003eBlenderで動く口内がVRMでは無効になった\u003c/h3\u003e\n\u003cp\u003e制作途中のVRM 0.x出力では、Blenderで動いていた口内のモーフが、書き出すと無効になる問題がありました。口内のモーフは、口を開けるときに歯や舌などの形を変えるためのデータです。\u003c/p\u003e\n\u003cp\u003eこのときは書き出し用の一時シーンだけでドライバーを外して修正し、編集用のBlenderには元の連動設定を残しました。その後、VRMを再読み込みし、ブラウザのビューアでも開口・閉口を確認しています。編集画面で動いていることに加えて、書き出したファイルでも同じ動作を確かめる必要がありました。これは途中で検証した互換版の話で、最新の公開モデルはVRM 1.0です。\u003c/p\u003e\n\u003ch2\u003e動かしてみて分かったこと\u003c/h2\u003e\n\u003cp\u003e今回いちばん手がかかったのは、生成した各パーツのつなぎ目と、表情や動きが入ったときの整合でした。頭と髪、胴と腕のように形が連続する部分は、生成時にまとめ、その後で編集用に分ける進め方へ落ち着いています。静止画では自然に見える目も、視線を動かして半目にすると別の問題が出てきます。衣装も、立った状態だけでなく脚を上げて確認する必要がありました。\u003c/p\u003e\n\u003cp\u003eTripoで形を用意し、Imagegenで参照や補修素材を作り、Blenderで構造と動きを調整する。それぞれを行き来しながら、Codexで修正用のスクリプトや比較画像、検証記録を作って進めた制作でした。\u003c/p\u003e\n\u003cp\u003e細い毛束やレースの粗さ、極端なポーズでの干渉、実際の配信アプリでのトラッキングや負荷の確認はまだ残っています。ARKitの52チャンネルへの対応も未検証です。それでも、元の4枚から表情や揺れのあるモデルを作り、VRoid Hubで見られるところまで持っていけました。\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://hub.vroid.com/characters/2964447268666891023/models/3762699592295630385\"\u003e姫希ひめの3Dモデルはこちら\u003c/a\u003e。制作後の様子は \u003ca href=\"https://x.com/himeki_princess\"\u003e@himeki_princess\u003c/a\u003e へ。\u003c/p\u003e","path":"/posts/himeki-hime-tripo-vrm"}]},"__N_SSG":true},"page":"/tags/[tag]","query":{"tag":"Blender"},"buildId":"98QpNRInUEsCIed-26qQl","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
